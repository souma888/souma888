name: Refresh profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_metrics.py
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public repository dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_metrics.py
      - name: Commit refreshed dashboard
        run: |
          if ! git diff --quiet -- assets/github-metrics.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/github-metrics.svg
            git commit -m 'chore: refresh public profile metrics'
            git push
          fi
